<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tweet Archive{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <header class="masthead">
    <div class="masthead__inner">
      <div>
        <h1 class="brand">Tweet Archive</h1>
        <p class="brand__sub">Search posts collected from the X API v2 and stored in PostgreSQL.</p>
      </div>
      {% block masthead_extra %}{% endblock %}
    </div>
  </header>
  <main class="shell">
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">
    Flask · psycopg2 · PostgreSQL. Every filter reaches the database as a bound parameter.
  </footer>
</body>
</html>
